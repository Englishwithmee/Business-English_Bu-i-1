<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English at Work</title><style>
:root{--ink:#193c3a;--muted:#5b7471;--green:#1a7669;--lime:#d8edb4;--paper:#f6f6ef;--line:#dce6df;--orange:#f0a56f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{max-width:1200px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:800;letter-spacing:-.04em;font-size:21px}.brand span{color:var(--green)}.badge{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--green);font-weight:800}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:235px 1fr;gap:32px;padding:30px 24px}.sidebar{position:sticky;top:90px;align-self:start}.navtitle{font-size:12px;letter-spacing:.12em;color:#80928d;font-weight:800;margin:20px 10px 8px}.navbtn{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:650}.navbtn.active{background:#dceee4;color:#185d52}.navbtn:hover{background:#e8f1e9}main{min-width:0}.hero{border-radius:22px;background:#174f49;color:white;padding:38px;position:relative;overflow:hidden}.hero:after{content:'✳';position:absolute;font-size:210px;color:#ffffff0d;right:15px;top:-65px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#bce2c9}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.045em;margin:12px 0}.hero p{color:#d8eae1;max-width:620px;margin:0}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.pill{border:1px solid #ffffff55;border-radius:30px;padding:5px 12px;font-size:13px}.section{margin-top:32px}.section h2{font-size:25px;letter-spacing:-.035em;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}.card h3{margin:0 0 9px;font-size:18px}.tag{display:inline-block;background:#e9f4dd;color:#477338;font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:5px;text-transform:uppercase;margin-bottom:12px}.phrase{font-size:19px;font-weight:650;margin:5px 0 10px}.secondary{color:var(--muted);font-size:14px}.play{border:1px solid #cbded4;background:#fff;color:var(--green);border-radius:8px;padding:7px 12px;font-weight:700}.play:hover,.button:hover{filter:brightness(.95)}.button{background:var(--green);color:white;border:0;border-radius:9px;padding:10px 18px;font-weight:750}.light{background:#e6f2e8;color:#226555}.activity{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:14px 0}.activity h3{margin:0 0 8px}.question{padding:16px 0;border-bottom:1px solid #edf1ed}.question:last-of-type{border:0}.question p{margin:0 0 9px;font-weight:650}.options{display:flex;flex-wrap:wrap;gap:8px}.option{background:#f7faf7;border:1px solid #d8e5dc;border-radius:8px;padding:8px 12px;color:var(--ink);text-align:left}.option.selected{border-color:#388c7d;background:#e8f5ed}.option.correct{border-color:#398665;background:#e1f4e8}.option.wrong{border-color:#d47769;background:#fff0ed}.feedback{min-height:24px;margin-top:7px;font-size:14px;font-weight:700}.good{color:#2c7955}.bad{color:#b25548}.actionrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.callout{padding:18px 20px;border-left:4px solid #e2a875;background:#fff5e7;border-radius:0 12px 12px 0;margin:18px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #e8efea}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.prompt{background:#edf6ed;padding:15px;border-radius:10px;margin:10px 0}.input{width:100%;padding:10px;border:1px solid #cedfd4;border-radius:8px}.stepper{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}.progress{font-size:13px;color:var(--muted)}footer{color:#82938a;text-align:center;padding:30px;font-size:13px}.letters{display:flex;flex-wrap:wrap;gap:7px}.letter{background:#f4f8f3;border:1px solid #dce8df;border-radius:8px;padding:8px 12px;color:#29675e;font-weight:800}.letter:hover{background:#dceee4}@media(max-width:760px){.layout{display:block;padding:18px 16px}.sidebar{position:static;display:flex;overflow:auto;gap:6px;margin-bottom:18px}.navtitle{display:none}.navbtn{white-space:nowrap;width:auto;font-size:13px;background:#fff}.grid{grid-template-columns:1fr}.hero{padding:28px}.top{padding:12px 16px}.top .badge{display:none}.activity{padding:18px}}
</style></head><body><header><div class="top"><div class="brand">✳ <span>English</span> at Work</div><span class="badge">Adult conversation · beginner</span></div></header><div class="layout"><aside class="sidebar" id="nav"></aside><main id="app"></main></div><footer>English at Work · Learn a little. Speak with confidence.</footer><script>
const warm=['What’s your name? What do you like to be called?','Where are you from?','What do you do?','How was your day today?','What do you usually do after work?','What do you like to do in your free time?','What kind of food do you like?','Do you prefer coffee or tea? Why?','What did you do last weekend?','Why do you want to learn English?'];
const pages=[['Welcome','Start here'],['Warm-up','Let’s talk'],['01 · Introductions','Useful phrases'],['01 · Practice','Meeting colleagues'],['02 · Work routines','Present simple'],['02 · Practice','Everyday activities'],['Speaking','Your turn']];let current=0;const app=document.querySelector('#app'), nav=document.querySelector('#nav');
function speak(t){if(!('speechSynthesis'in window)){alert('Audio is not available in this browser.');return} speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function listen(t){return `<button class="play" onclick="speak(decodeURIComponent('${encodeURIComponent(t)}'))">▶ Listen</button>`}
function hero(k,title,desc,meta){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p><div class="meta">${meta.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`}function sec(title,sub,content){return `<section class="section"><h2>${title}</h2><p class="sub">${sub}</p>${content}</section>`}function card(tag,phrase,note){return `<div class="card"><span class="tag">${tag}</span><div class="phrase">${phrase}</div><div class="secondary">${note}</div><div style="margin-top:15px">${listen(phrase)}</div></div>`}
function quiz(id,items){return `<div class="activity" id="${id}">${items.map((q,i)=>`<div class="question" data-answer="${q[2]}"><p>${i+1}. ${q[0]}</p><div class="options">${q[1].map((a,j)=>`<button class="option" onclick="selectOpt(this,${j})">${a}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div></div>`).join('')}<div class="actionrow"><button class="button" onclick="check('${id}')">Check answers</button><button class="button light" onclick="resetQuiz('${id}')">Try again</button></div><p class="progress" id="${id}-score"></p></div>`}
function selectOpt(el,n){el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('selected','correct','wrong'));el.classList.add('selected');el.closest('.question').dataset.selected=n;el.closest('.question').querySelector('.feedback').textContent=''}function check(id){let qs=[...document.querySelectorAll('#'+id+' .question')],correct=0;qs.forEach(q=>{let n=q.dataset.selected,a=+q.dataset.answer,buttons=q.querySelectorAll('.option'),f=q.querySelector('.feedback');buttons.forEach(b=>b.classList.remove('correct','wrong'));if(n===undefined){f.textContent='Choose an answer.';f.className='feedback bad'}else if(+n===a){correct++;buttons[n].classList.add('correct');f.textContent='Good job!';f.className='feedback good'}else{buttons[n].classList.add('wrong');f.textContent='Good try! Correct answer: '+buttons[a].textContent;f.className='feedback bad'}});document.getElementById(id+'-score').textContent=`Score: ${correct} / ${qs.length}`}
function resetQuiz(id){document.querySelectorAll('#'+id+' .question').forEach(q=>{delete q.dataset.selected;q.querySelectorAll('button').forEach(b=>b.classList.remove('selected','correct','wrong'));q.querySelector('.feedback').textContent=''});document.getElementById(id+'-score').textContent=''}
function render(){nav.innerHTML='<div class="navtitle">YOUR LESSONS</div>'+pages.map((p,i)=>`<button class="navbtn ${i===current?'active':''}" onclick="go(${i})">${p[0]} <span class="secondary">${p[1]}</span></button>`).join('');let h='';if(current===0){h=hero('Welcome to your learning space','Small conversations.<br>Big confidence.','Build practical English for meeting people and talking about your daily work.', ['2 lessons','Listen · Practise · Speak','Beginner'])+sec('Your learning path','Choose a lesson or start with a friendly conversation.',`<div class="grid"><div class="card"><span class="tag">01 · Meet people</span><h3>Meeting new colleagues</h3><p class="secondary">Introduce yourself and other people, practise greetings and spell names.</p><button class="button light" onclick="go(2)">Explore lesson →</button></div><div class="card"><span class="tag">02 · Daily life</span><h3>Everyday work activities</h3><p class="secondary">Use the present simple to talk about your job and routines.</p><button class="button light" onclick="go(4)">Explore lesson →</button></div></div><div class="actionrow"><button class="button" onclick="go(1)">Start with warm-up →</button></div>`)}
if(current===1){h=hero('Warm-up · Conversation','Let’s get talking.','Take turns asking and answering. Give a little extra detail when you can.',['10 questions','Pair work'])+sec('Get to know each other','Choose a question and start a conversation.',`<div class="activity">${warm.map((q,i)=>`<div class="question"><p>${String(i+1).padStart(2,'0')} &nbsp; ${q}</p>${listen(q)}</div>`).join('')}</div>`)}
if(current===2){h=hero('Lesson 01 · Language','Meeting new colleagues','Learn useful expressions for introductions and greetings in the workplace.',['Introductions','Alphabet','Speaking'])+sec('Introduce yourself','Listen and repeat. Choose a phrase that feels natural.',`<div class="grid">${card('Formal','Good morning. My name is Alisha Sharma.','A polite way to introduce yourself.')}${card('Everyday','Hi, I’m Lee.','A friendly, informal greeting.')}${card('First meeting','It’s good to meet you.','You can also say “Nice to meet you.”')}${card('Reply','It’s a pleasure to meet you, too.','A polite reply when meeting someone.')}</div>`)+sec('Introduce someone else','Use these expressions when people meet for the first time.',`<div class="grid">${card('Formal','May I introduce Maria Diaz?','Maria is our sales manager.')}${card('Informal','Amit, meet Edward.','Edward and Amit work together.')}${card('Everyday','This is my new assistant, Levi.','Use “This is …” to introduce someone.')}${card('Reply','Great to meet you.','You can reply “You too.”')}</div>`)+sec('The alphabet','Tap a letter to hear its name. Practise spelling your own name.',`<div class="activity"><div class="letters">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button class="letter" onclick="speak('${l}')">${l}</button>`).join('')}</div><div class="prompt">How do you spell your name? <br><strong>It’s A-N-N-A.</strong></div></div>`)}
if(current===3){h=hero('Lesson 01 · Practice','Ready to meet?','Choose the best answer, then check your work.',['Greetings','Introductions','Instant feedback'])+sec('Complete the conversation','Choose the best word or phrase.',quiz('q1',[["It’s good to ___ you.",['meet','meets','meeting'],0],["Hello. My ___ is Sebastian.",['name','names','named'],0],["Good ___. My name is Joe Carr.",['afternoon','pleasure','too'],0],["It’s a ___ to meet you.",['pleasure','meet','name'],0],["Nice to meet you, Sally.",['Nice to meet you, too.','I’m work here.','She meeting Sally.'],0]]))+sec('Correct the sentence','Choose the natural sentence.',quiz('q2',[["Which sentence is correct?",['Hi, my name is Adeyeyo.','Hi, I’m name’s Adeyeyo.','Hi, my names Adeyeyo.'],0],["Which introduction is correct?",['This is my new colleague, Martin.','This my new colleague, Martin.','This are my colleague, Martin.'],0],["Which sentence is correct?",['It’s good to meet you, Katherine.','It’s good meet you, Katherine.','It’s good to meeting you.'],0]]))+sec('Listening practice','Listen to this new practice dialogue and answer the questions.',`<div class="activity">${listen('Hello, I’m Jill Green. I am the finance manager. This is Daniel. He is my colleague. Nice to meet you.') } <p class="secondary">Computer-generated voice · You can listen more than once.</p></div>`+quiz('q3',[["What is Jill’s last name?",['Green','Cheam','Greene'],0],["What is Jill’s role?",['Finance manager','Designer','Intern'],0],["Who is Daniel?",['Jill’s colleague','Jill’s teacher','Jill’s customer'],0]]))}
if(current===4){h=hero('Lesson 02 · Language','Everyday work activities','Talk about the things you do regularly at work and in daily life.',['Present simple','Work activities','Routines'])+sec('Present simple','Use the present simple for habits and routines.',`<div class="card"><table class="table"><tr><th>Subject</th><th>Verb</th><th>Example</th></tr><tr><td>I / you / we / they</td><td>work</td><td>They work from home.</td></tr><tr><td>He / she / it</td><td>works</td><td>She works from home.</td></tr></table><div class="callout"><strong>Remember:</strong> add <strong>-s</strong> or <strong>-es</strong> to most verbs with he, she and it. <br>He works. She watches. He has a meeting.</div></div>`)+sec('Talk about your routine','Listen, repeat and change the sentences to make them true for you.',`<div class="grid">${card('Every morning','We prepare the food every morning.','A regular activity.')}${card('At work','She works from home on Mondays.','She + works.')}${card('Meetings','They have a meeting every morning.','They + have.')}${card('Break time','He drinks coffee twice a day.','He + drinks.')}</div>`)+sec('Useful time expressions','Place these at the beginning or end of your sentence.',`<div class="card"><p>every morning · every day · on Mondays · twice a day · from Monday to Friday</p><p><strong>Example:</strong> I check my emails every morning.</p>${listen('I check my emails every morning.')}</div>`)}
if(current===5){h=hero('Lesson 02 · Practice','Make it a habit.','Practise present simple forms and read about a manager’s day.',['Grammar','Listening','Reading'])+sec('Choose the correct word','Remember: he, she and it usually need -s.',quiz('q4',[["We ___ a meeting every day.",['have','has','having'],0],["She ___ a hairdresser.",['is','are','am'],0],["He ___ by train every morning.",['travels','travel','travelling'],0],["She ___ coffee twice a day.",['drinks','drink','drinking'],0],["My manager ___ from Monday to Friday.",['works','work','working'],0],["My colleagues ___ their emails every morning.",['read','reads','reading'],0],["The photocopier ___ working when there is no paper.",['stops','stop','stopping'],0]]))+sec('Listen and check','Listen to a short, newly created workplace routine.',`<div class="activity">${listen('Zoe works at a cafe. She starts at eight in the morning. She checks the tables before the cafe opens. She has lunch at one o’clock.') }<p class="secondary">Computer-generated voice · You can listen again.</p></div>`+quiz('q5',[["Zoe works at a café.",['True','False'],0],["She starts at 9 a.m.",['True','False'],1],["She checks the tables before the café opens.",['True','False'],0]]))+sec('Reading · Meet the manager','Read this adapted practice text, then answer.',`<div class="card"><span class="tag">Our team</span><h3>A typical working day</h3><p>Sumiko is a customer services manager. She usually cycles to work and arrives early. Every morning, she reads her emails and makes a list of things to do. Then she meets her colleagues to discuss the day’s work.</p><p>At lunchtime, Sumiko sometimes goes to a local restaurant with her team. In the afternoon, she answers emails and helps customers. She usually leaves the office at about 6 o’clock.</p>${listen('Sumiko is a customer services manager. She usually cycles to work and arrives early. Every morning, she reads her emails and makes a list of things to do. Then she meets her colleagues to discuss the day’s work. At lunchtime, Sumiko sometimes goes to a local restaurant with her team. In the afternoon, she answers emails and helps customers. She usually leaves the office at about six o’clock.')}</div>`+quiz('q6',[["Sumiko usually cycles to work.",['True','False'],0],["She reads her emails every morning.",['True','False'],0],["She always eats lunch at a restaurant.",['True','False'],1],["She usually leaves at about 6 o’clock.",['True','False'],0]]))}
if(current===6){h=hero('Speaking · Your turn','Make it personal.','Practise with a partner or speak aloud on your own.',['Role-play','Work routines','Confidence'])+sec('Role-play: a new colleague','Take turns. Change the names and job titles.',`<div class="grid"><div class="card"><span class="tag">Person A</span><h3>Meet your colleague</h3><p>Say hello. Introduce yourself and your job. Ask your partner’s name.</p><div class="prompt">“Hello, I’m … I’m a …”</div></div><div class="card"><span class="tag">Person B</span><h3>Respond and introduce</h3><p>Say your name. Respond politely. Introduce another colleague.</p><div class="prompt">“Nice to meet you. This is …”</div></div></div>`)+sec('Talk about your day','Answer in full sentences. Use the ideas below if you need help.',`<div class="activity">${['What do you do?','What time do you start work or study?','What do you do every morning?','Do you work or study from home?','What do you usually do after work?'].map((x,i)=>`<div class="question"><p>${i+1}. ${x}</p>${listen(x)}</div>`).join('')}<div class="callout">Try: <strong>I work … / I usually … / Every morning, I …</strong></div></div>`)+sec('My useful sentences','Write a few sentences about yourself. Your notes stay on this device.',`<div class="card"><textarea id="notes" class="input" rows="5" placeholder="Hello, my name is …&#10;I work …&#10;Every morning, I …" oninput="localStorage.setItem('englishwork-notes',this.value)"></textarea></div>`)}
app.innerHTML=h+`<div class="stepper"><button class="button light" onclick="go(${Math.max(0,current-1)})" ${current===0?'disabled':''}>← Previous</button><span class="progress">${current+1} / ${pages.length}</span><button class="button" onclick="go(${Math.min(pages.length-1,current+1)})" ${current===pages.length-1?'disabled':''}>Next →</button></div>`;let notes=document.getElementById('notes');if(notes)notes.value=localStorage.getItem('englishwork-notes')||''}
function go(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
